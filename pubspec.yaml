name: kaida_app
description: Kainuwa Digital Africa LMS Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  video_player: ^2.7.2
  chewie: ^1.7.4
  dio: ^5.4.0
  path_provider: ^2.1.2
  wakelock_plus: ^1.2.8
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#7351FF"
  image: "assets/images/logo.png"
  android: true
  ios: false
  android_12:
    color: "#7351FF"
    image: "assets/images/logo.png"
