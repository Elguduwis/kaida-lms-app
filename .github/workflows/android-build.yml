name: Android CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Generate Platform Folders
      run: flutter create --platforms=android .
        
    - name: Inject App Name and Permissions
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:label="kaida_app"/android:label="Kaida Learn"/g' android/app/src/main/AndroidManifest.xml
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Generate Icons and Splash
      run: |
        flutter pub run flutter_launcher_icons
        flutter pub run flutter_native_splash:create
      
    - name: Build Split APKs and App Bundle
      run: |
        flutter build apk --release --split-per-abi
        flutter build appbundle --release
      
    - name: Sign 64-bit APK (For Direct Download)
      run: |
        BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -n | tail -1)
        $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign --ks kaida-key.jks --ks-pass pass:kainuwa2026 --key-pass pass:kainuwa2026 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        
    - name: Upload 64-bit APK
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-Optimized-APK
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        
    - name: Strip Debug Signature and Sign Play Store Bundle
      run: |
        # 1. Physically delete the generic debug signature Flutter automatically added
        zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*.RSA" "META-INF/*.SF" "META-INF/*.MF" || true
        # 2. Sign the clean bundle with your official Kaida key
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore kaida-key.jks -storepass kainuwa2026 build/app/outputs/bundle/release/app-release.aab kaida
        
    - name: Upload Play Store Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-PlayStore-AAB
        path: build/app/outputs/bundle/release/app-release.aab
