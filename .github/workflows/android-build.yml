name: Android CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Generate Platform Folders
      run: flutter create --platforms=android .
        
    - name: Inject App Name and Permissions
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:label="kaida_app"/android:label="Kaida Learn"/g' android/app/src/main/AndroidManifest.xml
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Generate Icons and Splash
      run: |
        flutter pub run flutter_launcher_icons
        flutter pub run flutter_native_splash:create
      
    - name: Build Split APKs and App Bundle
      run: |
        flutter build apk --release --split-per-abi
        flutter build appbundle --release
        
    - name: Upload 64-bit APK
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-Optimized-APK
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        
    - name: Upload Play Store Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-PlayStore-AAB
        path: build/app/outputs/bundle/release/app-release.aab
