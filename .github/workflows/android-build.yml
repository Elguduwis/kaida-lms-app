name: Android CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Generate Platform Folders
      run: flutter create --platforms=android .
        
    - name: Inject Permissions and PIP (Option A)
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/<activity /<activity android:supportsPictureInPicture="true" /g' android/app/src/main/AndroidManifest.xml
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Sign APK with Permanent Keystore
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore kaida-key.jks -storepass kainuwa2026 build/app/outputs/flutter-apk/app-release.apk kaida
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kaida-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
