name: Kaida Learn Shorebird CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  shorebird-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Setup Shorebird
      uses: shorebirdtech/setup-shorebird@v1
        
    - name: Generate Platform Folders & Run Setup
      run: |
        flutter create --platforms=android .
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:label="kaida_app"/android:label="Kaida Learn"/g' android/app/src/main/AndroidManifest.xml
        flutter pub get
        flutter pub run flutter_launcher_icons
        flutter pub run flutter_native_splash:create

    - name: Build Shorebird Release (Base AAB)
      if: contains(github.event.head_commit.message, '[release]')
      env:
        SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      run: shorebird release android --artifact=aab

    - name: Decode Keystore & Sign Play Store Bundle
      if: contains(github.event.head_commit.message, '[release]')
      env:
        ENCODED_KEYSTORE: ${{ secrets.KAIDA_KEY_JKS_BASE64 }}
        STORE_PASSWORD: ${{ secrets.KAIDA_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KAIDA_KEY_PASSWORD }}
      run: |
        echo "$ENCODED_KEYSTORE" | base64 --decode --ignore-garbage > kaida_upload_key.jks
        zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*.RSA" "META-INF/*.SF" "META-INF/*.MF" || true
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore kaida_upload_key.jks -storepass $STORE_PASSWORD -keypass $KEY_PASSWORD build/app/outputs/bundle/release/app-release.aab kaida_upload_alias

    - name: Upload Signed Play Store Bundle
      if: contains(github.event.head_commit.message, '[release]')
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-Shorebird-AAB
        path: build/app/outputs/bundle/release/app-release.aab

    - name: Push Live OTA Update to Users
      if: "!contains(github.event.head_commit.message, '[release]')"
      env:
        SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      run: shorebird patch android
